name: KOSPI200 SSL Hybrid Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: true
        default: "2023-08-10"
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: true
        default: "2026-08-10"
      fee_side:
        description: "Per-side proportional cost (0.001 = 0.10%)"
        required: true
        default: "0.0"
      baseline_len:
        description: "HMA baseline length"
        required: true
        default: "60"
      ssl2_len:
        description: "JMA SSL2 length"
        required: true
        default: "5"
      exit_len:
        description: "HMA exit length"
        required: true
        default: "15"
      atr_len:
        description: "ATR length"
        required: true
        default: "14"
      atr_crit:
        description: "SSL2 ATR continuation criterion"
        required: true
        default: "0.9"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python kospi200_ssl_hybrid_backtest.py \
            --online \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --fee-side "${{ inputs.fee_side }}" \
            --baseline-len "${{ inputs.baseline_len }}" \
            --ssl2-len "${{ inputs.ssl2_len }}" \
            --exit-len "${{ inputs.exit_len }}" \
            --atr-len "${{ inputs.atr_len }}" \
            --atr-crit "${{ inputs.atr_crit }}" \
            --out output

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssl-hybrid-backtest-results
          path: output/
          if-no-files-found: warn
          retention-days: 30
